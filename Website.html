<!DOCTYPE html>
<html>
    <head>
        <title>Navbar</title>
        <style>
            body{
                margin: 0;
                font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            }
            .topnav{
                overflow: hidden;
                background-color: black;
            }
            .topnav a{
                float: left;
                color: aquamarine;
                text-align: center;
                padding: 14px 16px;
                text-decoration: none;
                font-size: 20px;
            }
            .topnav a:hover{
                background-color: yellowgreen;
                color: green;
            }
            .topnav a.active{
                background-color: #ffe066;
                color:goldenrod
            }
        </style>
    </head>
    <body>
        <div class="topnav">
            <a class="active" href="#home">Home</a>
            <a href="#about">About Us</a>
            <a href="#gallery">Gallery</a>
            <a href="#contact">Contact us</a>
        </div>
        <section>
            <img class="slides" src="China.jpg" style="height: 500px;width: 500px;">
            <img class="slides" src="India.jpg" style="height: 500px;width: 500px;">
            <img class="slides" src="Japan.jpeg" style="height: 500px;width: 500px;">
            <img class="slides" src="Smiley-removebg-preview.png" style="height: 500px;width: 500px;">
        </section>
        <script>
            var index=0
            carousel();
            function carousel(){
                var x=document.getElementsByClassName("slides");
                var i;
                for(i=0;i<x.length;i++){x[i].style.display="none";}
                index++;
                if(index>x.length){index=1}
                x[index-1].style.display="block";
                setTimeout(carousel,3000)
            }
        </script>
    </body>
</html>
